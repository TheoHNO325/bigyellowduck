<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>盛夏竹海</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden}
  body{
    background:linear-gradient(180deg,#8fc2a4 0%,#bcd8b8 40%,#d9dcb0 52%,#6f8a66 58%,#243c2c 100%);
  }
  #scene{display:block;width:100vw;height:100vh}
  #colophon{
    position:fixed;left:30px;top:28px;z-index:10;
    color:rgba(255,252,240,.92);
    font-family:"STKaiti","KaiTi","Kaiti SC","Noto Serif SC",serif;
    text-shadow:0 1px 14px rgba(20,40,30,.6);
    opacity:0;transition:opacity 2.4s ease;
    user-select:none;pointer-events:none;
  }
  #colophon.show{opacity:1}
  #colophon.hide{opacity:0 !important}
  #colophon .title{font-size:clamp(18px,2.6vw,30px);letter-spacing:6px;line-height:1.6}
  #colophon .line{width:54px;height:1px;background:rgba(255,252,240,.45);margin-top:14px}
  #colophon .sub{margin-top:12px;font-size:clamp(11px,1.2vw,14px);letter-spacing:3px;opacity:.62}
  #toggle{
    position:fixed;right:20px;bottom:20px;z-index:10;
    width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(20,40,30,.35);color:rgba(255,252,240,.85);
    font-family:"STKaiti","KaiTi",serif;font-size:17px;cursor:pointer;
    backdrop-filter:blur(4px);transition:all .25s ease;
  }
  #toggle:hover{background:rgba(40,70,50,.55);transform:scale(1.06)}
  #errbox{
    position:fixed;left:12px;bottom:12px;z-index:99;
    background:rgba(0,0,0,.82);color:#ffd75e;
    font:12px/1.6 Consolas,Menlo,monospace;
    padding:10px 14px;max-width:88vw;white-space:pre-wrap;display:none;
  }
  @media (max-width:640px){#colophon{left:18px;top:18px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="colophon">
  <div class="title">没有什么能阻止盛夏的衰亡</div>
  <div class="line"></div>
  <div class="sub">盛夏竹海 · 记于 2026-6-1</div>
</div>
<button id="toggle" title="显示 / 隐藏题字">题</button>
<div id="errbox"></div>
<script>
(function(){
'use strict';

var errbox=document.getElementById('errbox');
var errShown=false;
function showError(msg){
  if(errShown)return; errShown=true;
  try{
    errbox.style.display='block';
    errbox.textContent='[页面提示] '+msg;
  }catch(e){}
}
window.onerror=function(m,src,line,col){
  showError('JS 错误: '+m+' (第'+line+'行)');
};

var canvas=document.getElementById('scene');
var ctx=null;
if(canvas&&canvas.getContext){ ctx=canvas.getContext('2d'); }
if(!ctx){ showError('无法获取 canvas 2D 上下文，请换用较新的浏览器'); return; }

var W=0,H=0,DPR=1;
var TAU=Math.PI*2;
function rand(a,b){return a+Math.random()*(b-a);}
function mix(c1,c2,f){return [c1[0]+(c2[0]-c1[0])*f,c1[1]+(c2[1]-c1[1])*f,c1[2]+(c2[2]-c1[2])*f];}
function css(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')';}
var reduceMotion=false;
try{ reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

var SKY_TOP=[148,192,166],SKY_MID=[192,214,188],HORIZON=[246,232,190];
var GROUND_TOP=[226,210,170],GROUND_MID=[118,138,104],GROUND_DEEP=[36,54,40];

var layers=[],spots=[],motes=[],beams=[];

function build(){
  var horizonY=H*0.5;
  layers=[];
  var defs=[
    {z:.10,count:105,w:[2.5,5],   g:.035,alpha:.62,fog:.50,amp:.9, speed:.55,nodes:0,  edge:0},
    {z:.30,count:68, w:[5,9.5],   g:.13, alpha:.80,fog:.32,amp:1.6,speed:.66,nodes:100,edge:0},
    {z:.55,count:46, w:[9,17],    g:.24, alpha:.93,fog:.15,amp:2.6,speed:.78,nodes:64, edge:1},
    {z:.82,count:24, w:[16,30],   g:.42, alpha:1,  fog:.04,amp:3.8,speed:.88,nodes:52, edge:1},
    {z:1,  count:9,  w:[42,74],   g:1.28,alpha:1,  fog:0,  amp:6,  speed:.98,nodes:60, edge:0,blur:4}
  ];
  var fogC=[178,196,166];          // 雾向：青绿灰，让远竹仍深于天空
  var baseGreen=[40,86,62];
  var tipGreen=[138,176,128];
  for(var d=0;d<defs.length;d++){
    var def=defs[d],stalks=[];
    for(var i=0;i<def.count;i++){
      var f=def.count>1?i/(def.count-1):.5;
      stalks.push({
        x:-W*.06+W*f*1.12+rand(-W*.014,W*.014),
        w:rand(def.w[0],def.w[1]),
        h:H*rand(1.15,2.05),
        phase:rand(0,TAU),
        amp:def.amp*rand(.5,1.3),
        speed:def.speed*rand(.85,1.2)
      });
    }
    var base=mix(baseGreen,fogC,def.fog);
    if(def.z>=1){ base=mix(base,[10,20,12],.4); }   // 最前景压暗
    var tip=mix(mix(tipGreen,base,.35),fogC,def.fog*.7);
    var node=mix(base,[6,16,8],.6);
    var hi=mix(base,[228,242,202],.42);
    var sh=mix(base,[8,18,10],.55);
    layers.push({z:def.z,alpha:def.alpha,nodes:def.nodes,edge:def.edge,
      groundY:horizonY+def.g*H,blur:def.blur||0,stalks:stalks,
      colBase:base,colTip:tip,colNode:node,colHi:hi,colSh:sh});
  }
  spots=[];
  if(!reduceMotion){
    for(var s=0;s<14;s++){
      spots.push({x:rand(0,W),y:rand(H*.12,H*.66),r:rand(26,110),
        vx:rand(-7,7),vy:rand(-2,2),ph:rand(0,TAU),sp:rand(.25,.6)});
    }
  }
  motes=[];
  if(!reduceMotion){
    for(var m=0;m<70;m++){
      motes.push({x:rand(0,W),y:rand(0,H),r:rand(.4,2.1),
        vx:rand(3,16),vy:rand(-22,-6),ph:rand(0,TAU),sp:rand(.4,1.4),a:rand(.12,.4)});
    }
  }
  beams=[];
  if(!reduceMotion){
    for(var b=0;b<3;b++){
      beams.push({x:rand(W*.15,W*.85),w:rand(W*.05,W*.11),
        tilt:rand(-.1,.1),ph:rand(0,TAU),sp:rand(.3,.5)});
    }
  }
}

function resize(){
  var w=window.innerWidth||document.documentElement.clientWidth||800;
  var h=window.innerHeight||document.documentElement.clientHeight||600;
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=w;H=h;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  build();
}
window.addEventListener('resize',resize);

function drawStalk(st,layer,t,wind){
  var groundY=layer.groundY;
  var x=st.x,w=st.w,h=st.h,phase=st.phase,amp=st.amp,speed=st.speed;
  function off(f){
    return amp*wind*(Math.sin(t*speed+phase)*f*f+
                     0.35*Math.sin(t*speed*1.53+phase*2.1)*f*f*f);
  }
  var baseY=groundY,tipY=groundY-h,midY=groundY-h*.5;
  var xB=x+off(0),xM=x+off(.5),xT=x+off(1);
  var wT=w*.34,wM=w*.62;
  ctx.beginPath();
  ctx.moveTo(xB-w*.5,baseY);
  ctx.quadraticCurveTo(xM-wM*.5,midY,xT-wT*.5,tipY);
  ctx.lineTo(xT+wT*.5,tipY);
  ctx.quadraticCurveTo(xM+wM*.5,midY,xB+w*.5,baseY);
  ctx.closePath();
  var g=ctx.createLinearGradient(0,tipY,0,baseY);
  g.addColorStop(0,css(layer.colTip));
  g.addColorStop(1,css(layer.colBase));
  ctx.fillStyle=g;ctx.fill();
  if(layer.edge){
    ctx.lineCap='round';
    ctx.lineWidth=Math.max(1,w*.07);
    ctx.beginPath();
    ctx.moveTo(xB-w*.40,baseY);
    ctx.quadraticCurveTo(xM-wM*.40,midY,xT-wT*.40,tipY);
    ctx.strokeStyle=css(layer.colHi);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(xT+wT*.40,tipY);
    ctx.quadraticCurveTo(xM+wM*.40,midY,xB+w*.40,baseY);
    ctx.strokeStyle=css(layer.colSh);
    ctx.stroke();
  }
  if(layer.nodes){
    var n=Math.max(2,Math.round(h/layer.nodes));
    ctx.lineWidth=Math.max(1.2,Math.min(3.5,w*.09));
    ctx.strokeStyle=css(layer.colNode);
    for(var i=1;i<n;i++){
      var f=i/n;
      var y=groundY-h*f;
      var xo=off(f);
      var ww=w*(1-(1-wT/w)*f);
      ctx.beginPath();
      ctx.moveTo(x+xo-ww*.5,y);
      ctx.quadraticCurveTo(x+xo,y-ww*.09,x+xo+ww*.5,y);
      ctx.stroke();
    }
  }
}

function draw(t,dt){
  var horizonY=H*.5;
  var wind=reduceMotion?0.85:(0.72+0.28*Math.sin(t*.09+2)*Math.sin(t*.37+5));
  ctx.clearRect(0,0,W,H);
  // 天空
  var g=ctx.createLinearGradient(0,0,0,horizonY);
  g.addColorStop(0,css(SKY_TOP,1));g.addColorStop(.55,css(SKY_MID,1));g.addColorStop(1,css(HORIZON,1));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,horizonY+2);
  // 阳光
  var sg=ctx.createRadialGradient(W*.5,horizonY,10,W*.5,horizonY,H*.85);
  sg.addColorStop(0,'rgba(255,246,210,.6)');
  sg.addColorStop(.35,'rgba(255,240,196,.24)');
  sg.addColorStop(1,'rgba(255,240,196,0)');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,horizonY);
  // 地面
  g=ctx.createLinearGradient(0,horizonY,0,H);
  g.addColorStop(0,css(GROUND_TOP,1));
  g.addColorStop(.45,css(GROUND_MID,1));
  g.addColorStop(1,css(GROUND_DEEP,1));
  ctx.fillStyle=g;ctx.fillRect(0,horizonY,W,H-horizonY);
  // 远处雾带
  g=ctx.createLinearGradient(0,horizonY-.34*H,0,horizonY+.05*H);
  g.addColorStop(0,'rgba(238,228,192,0)');
  g.addColorStop(.75,'rgba(238,228,192,.45)');
  g.addColorStop(1,'rgba(238,228,192,.8)');
  ctx.fillStyle=g;ctx.fillRect(0,horizonY-.34*H,W,.39*H);
  // 顶部密叶 canopy
  g=ctx.createLinearGradient(0,0,0,H*.16);
  g.addColorStop(0,'rgba(16,32,24,.9)');
  g.addColorStop(.55,'rgba(24,46,34,.45)');
  g.addColorStop(1,'rgba(24,46,34,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H*.16);

  // 远层（雾中）
  for(var i=0;i<layers.length;i++){
    var layer=layers[i];
    if(layer.z>=.7)break;
    if(layer.blur)ctx.filter='blur('+layer.blur+'px)';
    ctx.globalAlpha=layer.alpha;
    for(var j=0;j<layer.stalks.length;j++)drawStalk(layer.stalks[j],layer,t,wind);
    ctx.globalAlpha=1;
    if(layer.blur)ctx.filter='none';
  }
  // 光束
  if(beams.length){
    ctx.save();
    ctx.globalCompositeOperation='screen';
    for(var b=0;b<beams.length;b++){
      var beam=beams[b];
      var a=.07+.025*Math.sin(t*beam.sp+beam.ph);
      var tilt=beam.tilt+Math.sin(t*.05+beam.ph)*.02;
      var cx=beam.x+Math.sin(t*.08+beam.ph*1.7)*W*.04;
      var top=-30,bot=horizonY+H*.3;
      var wT=beam.w,wB=beam.w*2.4;
      ctx.save();
      ctx.translate(cx,0);ctx.rotate(tilt);
      var lg=ctx.createLinearGradient(0,top,0,bot);
      lg.addColorStop(0,'rgba(255,250,220,'+(a*1.6)+')');
      lg.addColorStop(1,'rgba(255,250,220,0)');
      ctx.fillStyle=lg;
      ctx.beginPath();
      ctx.moveTo(-wT/2,top);ctx.lineTo(wT/2,top);
      ctx.lineTo(wB/2,bot);ctx.lineTo(-wB/2,bot);
      ctx.closePath();ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  // 中近层
  for(var i2=0;i2<layers.length;i2++){
    var layer2=layers[i2];
    if(layer2.z<.7||layer2.z>=1)continue;
    ctx.globalAlpha=layer2.alpha;
    for(var j2=0;j2<layer2.stalks.length;j2++)drawStalk(layer2.stalks[j2],layer2,t,wind);
    ctx.globalAlpha=1;
  }
  // 光斑
  if(spots.length){
    ctx.save();
    ctx.globalCompositeOperation='screen';
    for(var s=0;s<spots.length;s++){
      var sp=spots[s];
      sp.x+=sp.vx*dt;sp.y+=sp.vy*dt;
      if(sp.x<-sp.r)sp.x=W+sp.r;if(sp.x>W+sp.r)sp.x=-sp.r;
      if(sp.y<-sp.r)sp.y=H+sp.r;if(sp.y>H+sp.r)sp.y=-sp.r;
      var sa=(.05+.035*Math.sin(t*sp.sp+sp.ph))*.9;
      var rg=ctx.createRadialGradient(sp.x,sp.y,0,sp.x,sp.y,sp.r);
      rg.addColorStop(0,'rgba(255,250,214,'+sa+')');
      rg.addColorStop(1,'rgba(255,250,214,0)');
      ctx.fillStyle=rg;
      ctx.beginPath();ctx.arc(sp.x,sp.y,sp.r,0,TAU);ctx.fill();
    }
    ctx.restore();
  }
  // 最前景（虚化）
  for(var i3=0;i3<layers.length;i3++){
    var layer3=layers[i3];
    if(layer3.z<1)continue;
    ctx.filter='blur('+layer3.blur+'px)';
    for(var j3=0;j3<layer3.stalks.length;j3++)drawStalk(layer3.stalks[j3],layer3,t,wind);
    ctx.filter='none';
  }
  // 尘埃
  if(motes.length){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    for(var m=0;m<motes.length;m++){
      var mo=motes[m];
      mo.x+=mo.vx*dt;mo.y+=mo.vy*dt;
      if(mo.y<-10){mo.y=H+10;mo.x=rand(0,W);}
      if(mo.x>W+10)mo.x=-10;
      var ma=mo.a*(.55+.45*Math.sin(t*mo.sp+mo.ph));
      ctx.fillStyle='rgba(255,244,210,'+ma.toFixed(3)+')';
      ctx.beginPath();ctx.arc(mo.x+Math.sin(t*.6+mo.ph)*6,mo.y,mo.r,0,TAU);ctx.fill();
    }
    ctx.restore();
  }
  // 暗角
  var vg=ctx.createRadialGradient(W/2,H*.42,Math.min(W,H)*.35,W/2,H*.5,Math.max(W,H)*.85);
  vg.addColorStop(0,'rgba(10,20,14,0)');
  vg.addColorStop(1,'rgba(8,16,11,.45)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

var colophon=document.getElementById('colophon');
var toggle=document.getElementById('toggle');
var shown=true;
setTimeout(function(){colophon.classList.add('show');},1200);
toggle.addEventListener('click',function(){
  shown=!shown;
  colophon.classList.toggle('hide',!shown);
});

resize();
// 同步首帧：不等 rAF，立即画一帧，保证任何环境都有画面
try{ draw(0.016,0.016); }catch(e){ showError('首次绘制失败: '+e.message); }

var last=performance.now();
function frame(now){
  requestAnimationFrame(frame);   // 先排下一帧，绘制出错也不中断循环
  var dt=Math.min(.05,(now-last)/1000);
  last=now;
  try{ draw(now/1000,dt); }catch(e){ showError('绘制错误: '+e.message); }
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
