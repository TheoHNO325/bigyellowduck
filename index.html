<!DOCTYPE html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>当大黄鸭被发现在四大发明广场</title>

<meta name="author" content="HNO3">


<meta name="description" content="当大黄鸭被发现在四大发明广场 — 原创小说线上阅读">

<link rel="stylesheet" href="/bigyellowduck/css/novel.css">
<style>
  :root {
    --novel-max-width: 42rem;
    --novel-duck-bg-image: url('/bigyellowduck/images/dahuangya.jpg');
  }
</style>

<body class="novel-body novel-body--home">
  
  
<main class="novel-hero" role="main" aria-label="封面">
  <div class="novel-hero__bg" style="background-image: url('/bigyellowduck/images/dahuangya.jpg')"></div>
  <div class="novel-hero__veil" aria-hidden="true"></div>
  <div class="novel-hero__top-actions">
    <a class="novel-hero__cta novel-hero__cta--ghost" href="/bigyellowduck/poetry/">诗歌</a>
    <a class="novel-hero__cta novel-hero__cta--ghost" href="/bigyellowduck/waizhuan/">外传</a>
    <a class="novel-hero__cta" href="/bigyellowduck/read/">开始阅读</a>
  </div>
  <div class="novel-hero__center">
    <h1 class="novel-hero__title">当大黄鸭被发现在四大发明广场</h1>
    <p class="novel-hero__author">HNO3</p>
  </div>

  <section class="duck-game" id="duck-game" aria-label="主页小游戏：大黄鸭单车大作战">
    <header class="duck-game__head">
      <span class="duck-game__name">🦆 大黄鸭 · 单车大作战</span>
      <button class="duck-game__pause" id="duck-game-pause-btn" type="button" aria-label="暂停" hidden>⏸</button>
    </header>
    <div class="duck-game__stage">
      <canvas class="duck-game__canvas" id="duck-game-canvas" aria-label="游戏画面"></canvas>

      <div class="duck-game__overlay duck-game__overlay--start" id="duck-game-start">
        <p class="duck-game__overlay-title">🚴 开始骑行</p>
        <p class="duck-game__overlay-sub">限时骑到终点教学楼——赶早八！</p>
        <ul class="duck-game__hint">
          <li><b>W / S</b> — 上 / 下换道</li>
          <li><b>Z</b> — 撞到前按下，撞飞车手不扣血</li>
          <li><b>X</b> — 贴到汽车旁讨牛奶/香蕉加速</li>
          <li><b>P</b> — 暂停</li>
        </ul>
        <button class="duck-game__btn" id="duck-game-start-btn" type="button">开始游戏</button>
        <p class="duck-game__overlay-tip">或按 Enter 开始 · 在 65 秒内到达即为「赶早八成功」</p>
      </div>

      <div class="duck-game__overlay duck-game__overlay--over" id="duck-game-over" hidden>
        <p class="duck-game__overlay-title">💀 游戏结束</p>
        <p class="duck-game__overlay-sub">你被「GameOver」车碾过了…</p>
        <p class="duck-game__stats" id="duck-game-stats"></p>
        <button class="duck-game__btn" id="duck-game-restart-btn" type="button">再玩一次</button>
        <p class="duck-game__overlay-tip">或按 Enter 再来一局</p>
      </div>

      <div class="duck-game__overlay duck-game__overlay--pause" id="duck-game-pause" hidden>
        <p class="duck-game__overlay-title">⏸ 已暂停</p>
        <button class="duck-game__btn" id="duck-game-resume-btn" type="button">继续游戏</button>
      </div>

      <div class="duck-game__overlay duck-game__overlay--finish" id="duck-game-finish" hidden>
        <p class="duck-game__overlay-title" id="duck-game-finish-title"></p>
        <p class="duck-game__overlay-sub" id="duck-game-finish-sub"></p>
        <p class="duck-game__stats" id="duck-game-finish-stats"></p>
        <button class="duck-game__btn" id="duck-game-finish-btn" type="button">再玩一次</button>
        <p class="duck-game__overlay-tip">或按 Enter 再来一局</p>
      </div>

      <div class="duck-game__touch" id="duck-game-touch" hidden>
        <button class="duck-game__touch-btn" data-touch="up" type="button" aria-label="向上换道">▲</button>
        <button class="duck-game__touch-btn" data-touch="z" type="button" aria-label="撞飞">💥</button>
        <button class="duck-game__touch-btn" data-touch="x" type="button" aria-label="向汽车讨要食物">🥛</button>
        <button class="duck-game__touch-btn" data-touch="down" type="button" aria-label="向下换道">▼</button>
      </div>
    </div>
  </section>
</main>
<script src="/bigyellowduck/js/duck-bike-game.js"></script>

  
  <div class="novel-theme-flash" id="novel-theme-flash" aria-hidden="true"></div>
  <script src="/bigyellowduck/js/novel.js"></script>
</body>
</html>
