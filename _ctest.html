<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#ffffff}canvas{display:block}</style></head>
<body>
<canvas id="c" width="800" height="400"></canvas>
<script>
var ctx = document.getElementById('c').getContext('2d');
// 左上角红色方块
ctx.fillStyle = '#ff0000';
ctx.fillRect(0, 0, 100, 100);
// 右上角绿色方块
ctx.fillStyle = '#00aa44';
ctx.fillRect(700, 0, 100, 100);
// 中间一条黑色竖线
ctx.fillStyle = '#000000';
ctx.fillRect(398, 50, 4, 300);
// 渐变带
var g = ctx.createLinearGradient(0, 300, 0, 400);
g.addColorStop(0, '#ffffff');
g.addColorStop(1, '#0000ff');
ctx.fillStyle = g;
ctx.fillRect(0, 300, 800, 100);
document.title = 'canvas-test';
</script>
</body></html>
